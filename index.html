<style>
/* Tema Pronacampo: papel kraft, faixa verde, painéis creme */
:root{
  --bg:#EAE0C8;--panel:#F8F3E6;--fg:#3A3124;--muted:#6F6450;--line:#E0D3B4;--soft:#EFE6D0;
  --green:#4C9A2A;--green-dk:#3A7D20;--green-lo:#E3EBCB;--red:#B8442C;--ink:#4A3A22;--cream:#FFF8E6;
  --assent:#B8732C;--indig:#2E8A74;--quilo:#8B4F9E;--outras:#3F6FA0;--neutral:#C9BC9B;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --fs-cap:.8125rem;--fs-body:.9375rem;--fs-h:1.0625rem;--fs-title:1.75rem;
  --r:10px;--gap:1rem;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:var(--fs-body);line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green-dk);outline-offset:2px}
.wrap{max-width:82rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabeçalho */
.banner{position:relative;overflow:hidden;color:var(--cream);min-height:200px;display:flex;align-items:center;
  background:radial-gradient(circle at 30% 40%,rgba(255,240,210,.09) 0 1.5px,transparent 2.5px) 0 0/13px 13px,
    radial-gradient(circle at 70% 70%,rgba(60,35,10,.10) 0 1.5px,transparent 2.5px) 0 0/9px 9px,
    linear-gradient(180deg,#B3824B 0%,#9A6B37 100%);padding-block:28px 38px}
.banner .wrap{width:100%;position:relative;z-index:1}
.kicker{font-size:var(--fs-cap);letter-spacing:.14em;text-transform:uppercase;color:#F3E2BF}
.banner h1{font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,4.5vw,2.9rem);letter-spacing:.04em;line-height:1.05;margin:4px 0;text-shadow:0 2px 0 rgba(70,40,10,.35);text-wrap:balance}
.banner p{margin:0;color:#F6E9CC}
.simbolo{position:absolute;z-index:0;right:max(12px,calc(50% - 40rem));top:14px;height:calc(100% - 42px);width:auto;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(50,28,8,.35))}
@media (max-width:760px){.banner{min-height:0}.banner .wrap{padding-right:124px}.simbolo{right:8px;top:12px;height:auto;width:104px}}

/* Faixa de navegação */
.ribbon-wrap{position:relative;margin-top:-14px;z-index:3}
.ribbon{position:relative;background:linear-gradient(180deg,#5DB13A 0%,#4C9A2A 55%,#428A24 100%);border-radius:2px;box-shadow:0 3px 0 #2F6B1C,0 6px 14px rgba(60,40,10,.25)}
.ribbon::before{content:"";position:absolute;left:0;right:0;top:-7px;height:7px;background:linear-gradient(-45deg,transparent 33%,#F3E6C8 33% 66%,transparent 66%) 0 0/10px 7px repeat-x}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:6px 10px;scrollbar-width:thin}
.tabs button{color:#fff;background:none;border:0;padding:6px 12px;border-radius:5px;white-space:nowrap;cursor:pointer;font-size:1rem;text-shadow:0 1px 0 rgba(30,60,10,.4)}
.tabs button:hover{background:rgba(255,255,255,.14)}
.tabs button[aria-selected="true"]{background:var(--cream);color:var(--green-dk);text-shadow:none;font-weight:700}
.tabs button:focus-visible{outline-color:#fff}

/* Filtros */
.filters{position:sticky;top:0;z-index:4;background:rgba(234,224,200,.96);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);padding-block:10px;margin-top:14px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fsel{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);max-width:100%;min-width:0}
.fsel:disabled{opacity:.5}
.chip{font-size:var(--fs-cap);display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:#fff;font-weight:600}
.sw{width:.625rem;height:.625rem;border-radius:999px;display:inline-block;flex:none}
.chip[aria-pressed="true"] .sw{box-shadow:0 0 0 2px #fff}
.crumbs{margin-top:8px;font-size:var(--fs-cap);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs button{background:none;border:0;padding:0;color:var(--green-dk);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.crumbs b{color:var(--fg)}
.pill{font-size:var(--fs-cap);padding:3px 10px;border:0;border-radius:999px;background:var(--soft);cursor:pointer}
.lbl{font-size:var(--fs-cap);color:var(--muted)}
.sep{width:1px;height:22px;background:var(--line);margin-inline:4px}

/* Conteúdo */
main{padding-block:22px 40px;display:grid;gap:22px}
.take{margin:0;color:var(--muted);font-size:1rem}
.take b{color:var(--fg);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;align-content:start}
.kpi .l{font-size:var(--fs-cap);color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:1.65rem;color:var(--green-dk);font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:var(--fs-cap);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:14px;align-items:start}
.grid.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:900px){.grid.g2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.card h3{margin:0;font-size:var(--fs-body);font-weight:700;color:var(--green-dk)}
.card .help{margin:0;font-size:var(--fs-cap);color:var(--muted)}
h2.sec{margin:6px 0 0;font-size:var(--fs-h);color:var(--green-dk)}
.bars{display:grid;gap:1px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(3rem,1fr) minmax(4.2rem,auto);align-items:center;gap:8px;width:100%;background:none;border:0;padding:4px 4px;font-size:var(--fs-cap);text-align:left;border-radius:6px}
button.bar{cursor:pointer}
button.bar:hover{background:var(--soft)}
.bar[aria-pressed="true"]{background:var(--soft);font-weight:700}
.bar.dim{opacity:.45}
.bar .t{height:.7rem;background:var(--soft);border-radius:999px;overflow:hidden}
.bar .f{display:block;height:100%;border-radius:999px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .n{line-height:1.2}
.stack{display:flex;height:1.1rem;border-radius:999px;overflow:hidden;background:var(--soft)}
.stack span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:4px 12px;font-size:var(--fs-cap)}
.legend div{display:flex;align-items:center;gap:6px}
.legend .pc{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.empty{font-size:var(--fs-cap);color:var(--muted)}
.toggle{display:flex;flex-wrap:wrap;gap:6px}
.mapbox{position:relative;min-height:22rem}
.mapbox svg{display:block}
.area{cursor:pointer}
.area:hover{fill-opacity:.82}
.pt{cursor:pointer}
.mlbl{font-size:12px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:#FBF6E8;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.mlbl.m{font-weight:400;font-size:11px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:#FFFDF6;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(30,42,34,.14);padding:6px 10px;font-size:var(--fs-cap);max-width:17rem;z-index:5}
.tip b{display:block}
.tip span{color:var(--muted)}
.ramp{display:inline-flex;align-items:center;gap:6px}
.ramp i{display:inline-block;width:5rem;height:.5rem;border-radius:999px;background:linear-gradient(90deg,#EEEBD2,#3A7D20)}
.legend-row{display:flex;flex-wrap:wrap;gap:10px;font-size:var(--fs-cap);color:var(--muted)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}

/* Tabelas */
.tablebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.search{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#FFFDF6;min-width:0;flex:1 1 14rem;max-width:26rem}
.btn{font-size:var(--fs-cap);padding:6px 12px;border:1px solid var(--green);border-radius:8px;background:var(--panel);color:var(--green-dk);cursor:pointer;font-weight:600}
.btn:hover{background:var(--green-lo)}
.tw{max-height:34rem;overflow:auto;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-cap);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{min-width:10.5rem}
th{position:sticky;top:0;background:var(--panel);text-align:left;border-bottom:1px solid var(--line);padding:0;z-index:1;vertical-align:bottom}
th button{display:block;width:100%;background:none;border:0;padding:8px 6px;font-weight:700;text-align:inherit;cursor:pointer}
th.num,td.num{text-align:right}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--soft)}
tr.sel td{background:var(--green-lo)!important;font-weight:600}
@media (max-width:700px){.hide-sm{display:none}}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:stretch}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.ficha{position:relative;padding:0}
.ficha-in{position:absolute;inset:0;overflow:auto;padding:14px 16px;display:grid;gap:8px;align-content:start}
@media (max-width:900px){.ficha-in{position:static;max-height:36rem}}
.ficha h4{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:var(--fs-cap);text-transform:uppercase;letter-spacing:.06em;color:var(--green-dk)}
.ficha dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;margin:0;font-size:var(--fs-cap)}
.ficha dt{color:var(--muted)}
.ficha dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ficha dd.long{grid-column:1/-1;text-align:left}
.ficha a{color:var(--green-dk)}
.fhead{display:flex;justify-content:space-between;gap:8px;align-items:start}
.fhead h3{font-size:1.05rem}
.yes{color:var(--green-dk);font-weight:600}
.no{color:var(--red);font-weight:600}
.method{display:grid;gap:12px;max-width:none}
.method dl{display:grid;grid-template-columns:minmax(10rem,16rem) minmax(0,1fr);gap:6px 18px;margin:0}
.method dt{font-weight:700;color:var(--green-dk)}
.method dd{margin:0}
@media (max-width:640px){.method dl{grid-template-columns:minmax(0,1fr)}}
.method ul{margin:0;padding-left:1.1rem;display:grid;gap:4px}
/* blocos e peças visuais */
.blk{display:grid;gap:12px}
.blk-h h2{margin:0;font-size:1.15rem;color:var(--green-dk);display:flex;align-items:center;gap:12px}
.blk-h h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--line),transparent)}
.blk-h p{margin:3px 0 0;color:var(--muted);font-size:var(--fs-cap);max-width:none}
.lay{display:grid;gap:14px;align-items:stretch}
.lay.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.lay.g1{grid-template-columns:minmax(0,1fr)}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:400px){.kpis.k4{grid-template-columns:minmax(0,1fr)}}
.kpis.k4 .kpi .v{font-size:1.9rem}
details.more{border-top:1px dashed var(--line);padding-top:6px}
details.more summary{cursor:pointer;font-size:var(--fs-cap);color:var(--green-dk);font-weight:600;list-style:none;padding:4px 0}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"− "}
details.more[open] summary{margin-bottom:6px}
.bars{gap:3px}
.bar{padding:5px 4px}
.lay.g3e{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1050px){.lay.g3e{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.lay.g2e,.lay.g3e{grid-template-columns:minmax(0,1fr)}}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,12.5rem),1fr));gap:10px}
.ring{display:grid;grid-template-columns:54px minmax(0,1fr);grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
button.ring{cursor:pointer}
button.ring:hover{border-color:var(--green);box-shadow:0 2px 0 var(--green-lo)}
.ring.on{border-color:var(--green-dk);box-shadow:0 0 0 2px var(--green-lo)}
.ring svg{grid-row:1/3}
.ring .rv{font-family:var(--serif);font-size:1.3rem;line-height:1.1;color:var(--fg);font-variant-numeric:tabular-nums;align-self:end}
.ring .rl{font-size:var(--fs-cap);color:var(--muted);line-height:1.25;align-self:start}
.wf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:460px){.wf{grid-template-columns:minmax(0,1fr)}}
.waffle{display:grid;grid-template-columns:repeat(10,14px);grid-auto-rows:14px;gap:3px}
.waffle span{border-radius:3px}
.legend.one{grid-template-columns:minmax(0,1fr)}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;height:210px;align-items:stretch}
.col{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:4px;text-align:center;background:none;border:0;padding:2px;border-radius:8px;min-width:0}
button.col{cursor:pointer}
button.col:hover{background:var(--soft)}
.col.on{background:var(--green-lo)}
.col .cv{font-size:var(--fs-cap);font-variant-numeric:tabular-nums;font-weight:600}
.col .cb{display:flex;align-items:flex-end;justify-content:center}
.col .cb i{display:block;width:72%;max-width:44px;border-radius:7px 7px 2px 2px}
.col .cl{font-size:.75rem;color:var(--muted);line-height:1.2;min-height:2.4em}
.ntiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,10rem),1fr));gap:10px}
.nt{display:grid;gap:2px;align-content:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.card .nt{background:#FFFDF6}
button.nt{cursor:pointer}
button.nt:hover{border-color:var(--green)}
.nt b{font-family:var(--serif);font-weight:400;font-size:1.45rem;color:var(--green-dk);font-variant-numeric:tabular-nums;line-height:1.15}
.nt span{font-size:var(--fs-cap);line-height:1.25}
.nt small{font-size:.75rem;color:var(--muted)}
.srow{display:grid;gap:6px}
.srow + .srow{padding-top:10px;border-top:1px dashed var(--line)}
.cmpgrp{display:grid;gap:2px}
.cmpgrp + .cmpgrp{padding-top:6px;border-top:1px dashed var(--line)}
footer{background:#7E5428;color:#F3E6C8;font-size:var(--fs-cap);text-align:center;padding:18px 16px 24px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

// ---------- Peças visuais (padrão único: barras; verde = dado, vermelho = alerta) ----------
const sec = (title, lead, ...kids) => h('section', {class: 'blk'}, h('div', {class: 'blk-h'}, h('h2', {text: title}), lead ? h('p', {text: lead}) : null), ...kids);
const g = (cls, ...kids) => h('div', {class: 'lay ' + cls}, ...kids);
const lead = (...parts) => h('p', {class: 'take'}, ...parts);
const B = (t) => h('b', {text: t});
const kpis4 = (...k) => h('div', {class: 'kpis k4'}, ...k);
function columns(items, o) {
  o = o || {};
  const max = Math.max(1, ...items.map((i) => i.value || 0));
  return h('div', {class: 'cols'}, items.map((it) => h('div', {class: 'col', title: `${it.label}: ${(o.fmt || fmt)(it.value)}`},
    h('span', {class: 'cv', text: (o.fmt || fmt)(it.value)}), h('span', {class: 'cb'}, h('i', {style: `height:${Math.max(1.5, (it.value || 0) / max * 100)}%;background:${it.color || GREEN}`})), h('span', {class: 'cl', text: it.label}))));
}
// Divide uma lista em principais + "ver todos"
function withMore(main, rest) {
  if (!rest || !rest.childNodes || !rest.childNodes.length) return [main];
  return [main, h('details', {class: 'more'}, h('summary', null, 'Ver todos os itens'), rest)];
}
// % das escolas que têm cada item (vermelho se menos da metade; itens "ruins" em vermelho se mais da metade)
function hasBars(rows, list, o) {
  o = o || {};
  const items = list.map(([k, label, bad]) => {
    const c = cnt(rows, (r) => r[k] === 1), v = div(c, rows.length);
    const alert = v != null && (bad ? v > 0.5 : v < 0.5);
    return {key: k, label, value: v, text: `${pct(v)} · ${fmt(c)}`, color: alert ? RED : GREEN, title: `${fmt(c)} de ${fmt(rows.length)} escolas` + (bad ? '' : ' · clique para ver as que não têm'), bad};
  });
  return bars(items, {max: 1, onClick: o.click === false ? null : (k) => { const it = items.find((x) => x.key === k); if (!it.bad) goFalta(k); }, active: st.falta});
}
const hasCard = (rows, title, help, main, rest) => card(title, help, ...[].concat(withMore(hasBars(rows, main), rest && rest.length ? hasBars(rows, rest) : null)));
// parte de um total (ex.: % dos docentes), com alerta opcional
const shareBars = (total, list, o) => bars(list.map(([label, v, alert]) => ({key: label, label, value: div(v, total), text: `${pct(div(v, total))} · ${fmt(v)}`, color: alert ? RED : GREEN})), Object.assign({max: 1}, o || {}));
const countBars = (list, o) => bars(list.map(([label, v, key]) => ({key: key || label, label, value: v, color: o && o.color})), o);

// ---------- Resultados ----------
function tabResultados(rows, a) {
  const RF = refs();
  const ET = [['ai', 'Fundamental – anos iniciais'], ['af', 'Fundamental – anos finais'], ['med', 'Ensino médio']];
  const block = (ind, title, help, lowGood) => {
    const max = Math.max(1, ...ET.flatMap(([e]) => [rate(rows, `${ind}_${e}`) || 0, ...RF.map(([, r]) => (r && r[`${ind}_${e}`]) || 0)]));
    const parts = ET.map(([e, lab]) => {
      const mine = rate(rows, `${ind}_${e}`);
      const ref = RF[0][1] && RF[0][1][`${ind}_${e}`];
      const worse = mine != null && ref != null && (lowGood ? mine > ref + 1 : mine < ref - 1);
      return h('div', {class: 'cmpgrp'}, h('span', {class: 'lbl', text: lab}), bars([
        {key: 'c', label: 'Escolas do campo', value: mine, text: pp(mine), color: worse ? RED : GREEN},
        ...RF.map(([l, r], i) => ({key: 'r' + i, label: l, value: r ? r[`${ind}_${e}`] : null, text: pp(r ? r[`${ind}_${e}`] : null), color: GREY}))], {max: ind === 'apr' ? 100 : max}));
    });
    return card(title, help, ...parts);
  };
  const semDado = cnt(rows, (r) => r.apr_fun == null && r.apr_med == null);

function csv(name, header, lines) {
  const esc = (v) => { const s = v == null ? '' : String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const txt = '﻿' + [header, ...lines].map((l) => l.map(esc).join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob([txt], {type: 'text/csv;charset=utf-8'}));
  const el = h('a', {href: url, download: name}); document.body.append(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const num = (x) => typeof x === 'number' ? (Number.isInteger(x) ? x : x.toLocaleString('pt-BR', {maximumFractionDigits: 3})) : x;
function tabComparar() {
  const U = units();
  const list = U.list.map((u) => ({...u, vals: Object.fromEntries(CMP.map(([k, , f]) => [k, f(u.a)]))}));
  const {k, d} = st.csort;
  list.sort((x, y) => k === 'nome' ? x.label.localeCompare(y.label, 'pt-BR') * d : ((x.vals[k] ?? -Infinity) - (y.vals[k] ?? -Infinity)) * d);
  const total = agg(P());
  const BAD = new Set(['temp', 'dist', 'tdif']), NEUTRAL = new Set(['apd', 'rural', 'transp']);
  const ext = Object.fromEntries(CMP.map(([key]) => { const vs = list.map((u) => u.vals[key]).filter((v) => v != null && isFinite(v)); return [key, [Math.min(...vs), Math.max(...vs)]]; }));
  const heat = (key, v) => {
    if (v == null || !isFinite(v) || list.length < 2) return null;
    const [lo, hi] = ext[key]; const t = hi > lo ? (v - lo) / (hi - lo) : 0;
    if (NEUTRAL.has(key)) return null;
    const rgb = BAD.has(key) ? '184,68,44' : '58,125,32';
    return `background:rgba(${rgb},${(0.03 + t * 0.27).toFixed(3)})`;
  };
  const th = (key, label, cls) => h('th', {class: cls, 'aria-sort': st.csort.k === key ? (st.csort.d > 0 ? 'ascending' : 'descending') : 'none'}, h('button', {type: 'button', onclick: () => set({csort: {k: key, d: st.csort.k === key ? -st.csort.d : (key === 'nome' ? 1 : -1)}})}, label));
  const table = h('table', null, h('thead', null, h('tr', null, th('nome', U.L.nome), CMP.map(([key, label]) => th(key, label, 'num')))),
    h('tbody', null, list.map((u) => h('tr', {class: 'click' + (U.L.nome === 'Distrito' && st.dist === u.key ? ' sel' : ''), tabindex: '0', onclick: () => set(U.L.pick(u.key)), onkeydown: (e) => { if (e.key === 'Enter') set(U.L.pick(u.key)); }}, h('td', {text: u.label}), CMP.map(([key, , , f]) => h('td', {class: 'num', style: heat(key, u.vals[key]), text: f(u.vals[key])})))),
      h('tr', null, h('td', null, h('b', {text: 'Total da seleção'})), CMP.map(([, , f, ff]) => h('td', {class: 'num'}, h('b', {text: ff(f(total))}))))));
  const where = st.mun ? `os distritos de ${st.mun}` : st.cre ? `os municípios da ${st.cre}` : 'as 12 coordenadorias regionais';
  return {nodes: [card(`Comparar ${where}`, `Clique numa linha para descer um nível. Clique no título de uma coluna para ordenar. ${U.L.nome === 'Distrito' ? 'O distrito com o mesmo nome do município é a sede.' : ''}`,
    h('div', {class: 'tablebar'}, h('span', {class: 'lbl', text: `${fmt(list.length)} ${U.L.nome === 'CRE' ? 'coordenadorias' : U.L.nome === 'Município' ? 'municípios' : 'distritos'} com escolas do campo`}), h('button', {type: 'button', class: 'btn', onclick: () => csv(`comparativo_${U.L.nome.toLowerCase()}.csv`, [U.L.nome, ...CMP.map((c) => c[1])], list.map((u) => [u.label, ...CMP.map(([key]) => num(u.vals[key]))]))}, 'Baixar tabela (CSV)')),
    h('div', {class: 'tw'}, table))]};
}
